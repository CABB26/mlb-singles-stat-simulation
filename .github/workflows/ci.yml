name: HR Machine CI
on:
  pull_request:
  push:
    branches: [main, hr-sim-engine-v2]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check public/app.mjs
      - run: node --check public/model.mjs
      - run: node --check public/imports.mjs
      - run: node --check src/worker.mjs
